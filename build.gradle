plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devopsshack'
version = '1.0.0'
description = 'GradleBoard - a Gradle-powered DevOps build dashboard'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    mustRunAfter 'test'
}

// -----------------------------
// Custom tasks for Gradle demos
// -----------------------------
tasks.register('helloGradle') {
    group = 'tutorial'
    description = 'Prints a message from a custom Gradle task.'
    doLast {
        println 'Hello from GradleBoard!'
    }
}

tasks.register('projectInfo') {
    group = 'tutorial'
    description = 'Prints project and build information.'
    doLast {
        println "Project      : ${project.name}"
        println "Group        : ${project.group}"
        println "Version      : ${project.version}"
        println "Java         : ${java.toolchain.languageVersion.get()}"
        println "Build folder : ${layout.buildDirectory.get().asFile}"
    }
}

tasks.register('qualityCheck') {
    group = 'verification'
    description = 'Runs the project verification lifecycle.'
    dependsOn 'test', 'check'
}

tasks.register('packageApp') {
    group = 'build'
    description = 'Runs tests and packages the executable Spring Boot JAR.'

    dependsOn 'test', 'bootJar'

    doLast {
        println 'Application packaged: build/libs/gradleboard.jar'
    }
}
